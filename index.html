<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sacred Temple — Welcome</title>
<link rel="stylesheet" href="styles.css">

<style>
/* Fullscreen Carousel */
.hero-carousel {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
}

.hero-slide {
  position: absolute;
  width: 100%;
  height: 100%;
  background-size: cover;
  background-position: center;
  opacity: 0;
  transition: opacity 1s ease;
  cursor: pointer;
}

.hero-slide.active {
  opacity: 1;
}

.hero-overlay {
  position: absolute;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  color: white;
  text-shadow: 0 2px 10px black;
}

.hero-overlay h1 {
  font-size: 2.5rem;
  margin-bottom: 10px;
}

.hero-btn {
  padding: 12px 28px;
  background: rgba(255,255,255,0.2);
  border: 2px solid #fff;
  color: white;
  border-radius: 8px;
  font-size: 1.2rem;
  cursor: pointer;
  backdrop-filter: blur(4px);
}
.hero-btn:hover {
  background: rgba(255,255,255,0.4);
}

/* Arrows */
.arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 3rem;
  color: white;
  cursor: pointer;
  padding: 10px;
  text-shadow: 0 2px 10px black;
  user-select: none;
}
.arrow:hover {
  color: #ffe;
}
.arrow-left { left: 20px; }
.arrow-right { right: 20px; }

/* Dots */
.carousel-dots {
  position: absolute;
  bottom: 30px;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 10px;
}
.dot {
  width: 14px;
  height: 14px;
  background: white;
  opacity: 0.4;
  border-radius: 50%;
  cursor: pointer;
}
.dot.active { opacity: 1; }
</style>

</head>
<body>

<!-- ──────────────── FULLSCREEN CAROUSEL ──────────────── -->
<div class="hero-carousel">

  <!-- Slides (replace with your own images) -->
  <div class="hero-slide active" style="background-image:url('https://instaastro.com/blog/wp-content/uploads/2022/04/feature-image-kashi-vishwanath.jpg');" onclick="goToSite()"></div>
  <div class="hero-slide" style="background-image:url('https://i.redd.it/jsxfnjcn49e61.jpg');" onclick="goToSite()"></div>
  <div class="hero-slide" style="background-image:url('https://irisholidays.com/keralatourism/wp-content/uploads/2023/03/madurai-meenakshi-temple-view-1024x819.jpg');" onclick="goToSite()"></div>

  <!-- Overlay Text -->
  <div class="hero-overlay">
    <h1>Welcome to Sacred Temple</h1>
    <button class="hero-btn" onclick="goToSite()">Enter Website</button>
  </div>

  <!-- Arrows -->
  <div class="arrow arrow-left" onclick="prevSlide()">&#10094;</div>
  <div class="arrow arrow-right" onclick="nextSlide()">&#10095;</div>

  <!-- Dots -->
  <div class="carousel-dots">
    <div class="dot active" onclick="setSlide(0)"></div>
    <div class="dot" onclick="setSlide(1)"></div>
    <div class="dot" onclick="setSlide(2)"></div>
  </div>
</div>

<script>
// Carousel Logic
let currentHero = 0;
const slides = document.querySelectorAll(".hero-slide");
const dots = document.querySelectorAll(".dot");

function showSlide(n) {
  slides.forEach((s,i)=> s.classList.toggle("active", i===n));
  dots.forEach((d,i)=> d.classList.toggle("active", i===n));
  currentHero = n;
}

function nextSlide() { showSlide((currentHero + 1) % slides.length); }
function prevSlide() { showSlide((currentHero - 1 + slides.length) % slides.length); }
function setSlide(n) { showSlide(n); }

// autoplay every 4 seconds
setInterval(nextSlide, 4000);

// Enter website
function goToSite() {
  window.location.href = "index.html";
}
</script>

</body>
</html>
